            .btn {

                transition: all 0.35s ease;
                cursor: pointer;
            }

            .btn::before {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.25), transparent);
                transform: translateX(-100%);
                transition: transform 0.6s ease;
                border-radius: 30px;
            }

            .btn:hover::before {
                transform: translateX(100%);

            /* --- HERO SLIDESHOW ANIMATION --- */
/* --- FULL HERO SECTION CSS --- */

.hero {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 20px;
    margin-top: 10px;
    position: relative; /* Required for the pseudo-element absolute positioning */
    overflow: hidden;   /* Prevents the 'scale' animation from causing scrollbars */
    background-color: #000; /* Fallback color while images load */
}

/* The Slideshow Layer */
.hero::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1; /* Sits behind the text but inside the hero container */
    
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    
    /* 18s total: 6s per image for a calmer feel */
    animation: backgroundSlideshow 18s infinite ease-in-out;
    transition: background-image 1s ease-in-out;
}

/* Tagline/Text on top of the slideshow */
#text {
    position: relative;
    z-index: 10; /* Ensures tagline is always above the moving background */
    width: 80%;
    pointer-events: none; /* Allows clicks to pass through to links if any */
}

@keyframes backgroundSlideshow {
    0%, 100% {
        background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)), 
                          url({% static 'back1.jpg' %});
        transform: scale(1);
    }
    33% {
        background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)), 
                          url('{% static 'back2.webp' %}');
        transform: scale(1.1);
    }
    66% {
        background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)), 
                          url('{% static 'back3.jpg' %}');
        transform: scale(1.05);
    }
}

/* Optional: Smooth hover effect for the tagline text */
#text:hover {
    transform: scale(1.02);
    transition: transform 0.4s ease;
}

            /* --- EVENTS SLIDER --- */

            .swiper {

            .swiper-slide {

                height: 100%;

            .overlay {

            .nav-ite {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #ffffff;

    /* glass background */
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 14px;
    cursor: pointer;

    /* glass depth */
    box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.35),
        0 10px 25px rgba(0, 0, 0, 0.35);

    transition: all 0.4s ease;
    }

    /* Hover: light reflection + glow */
    .nav-ite:hover {
    transform: translateY(-3px) scale(1.06);

    background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.35),
        rgba(255, 255, 255, 0.1)
    );

    box-shadow:
        inset 0 2px 6px rgba(255, 255, 255, 0.45),
        0 0 8px rgba(173, 216, 255, 0.9),
        0 8px 35px rgba(0, 0, 0, 0.45);

    /* reflection on hover */
    -webkit-box-reflect: below 8px
        linear-gradient(transparent, rgba(255, 255, 255, 0.2));
    }
    .nav-item {
        color: #888;
        text-decoration: none;
        margin: 0 15px;
        font-weight: 500;
        text-transform: uppercase;
        font-size: 0.75rem;
        position: relative;
        white-space: nowrap;
        transition: 
            color 0.25s ease,
            transform 0.2s ease,
            text-shadow 0.25s ease;
    }

    /* 🔥 Hover glow */
    .nav-item:hover {
        color: var(--accent-blue);
        text-shadow: 
            0 0 8px rgba(59, 130, 246, 0.7),
            0 0 16px rgba(59, 130, 246, 0.5);
        transform: scale(1.05);
    }

    /* ✅ Active state */
    .nav-item.active {
        color: var(--accent-blue);
        transform: scale(1.08);
    }

    /* underline */
    .nav-item::after {
        content: '';
        position: absolute;
        bottom: -6px;
        left: 50%;
        width: 0;
        height: 2px;
        background: var(--accent-blue);
        transition: 0.3s ease;
    }

    .nav-item:hover::after,
    .nav-item.active::after {
        width: 100%;
        left: 0;
    }

    /* click feedback */
    .nav-item:active {
        transform: scale(0.97);
    }

        <!-- Swiper JS -->
        <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
        <script>
        // --- Existing Swiper Initialization ---
        var swiper = new Swiper(".mySwiper", {
            slidesPerView: 'auto',
            spaceBetween: 30,
            centeredSlides: true,
            loop: true,
            navigation: {
                nextEl: "#slide-next",
                prevEl: "#slide-prev",
            },
        });

        // --- Video Controls ---
        function playVideo(box) {
            const video = box.querySelector("video");
            video.play();
        }
        function pauseVideo(box) {
            const video = box.querySelector("video");
            video.pause();
            video.currentTime = 0;
        }

        // --- UPDATED SCROLL SPY LOGIC ---
        const sections = document.querySelectorAll("section[id]");
        const navLinks = document.querySelectorAll(".nav-item");

        const observerOptions = {
            root: null,
            // rootMargin 'top bottom left right'
            // -20% from top means the section must reach the upper part of the screen to activate
            rootMargin: "-20% 0px -70% 0px", 
            threshold: 0
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = entry.target.getAttribute("id");
                    
                    navLinks.forEach(link => {
                        link.classList.remove("active");
                        if (link.getAttribute("href") === `#${id}`) {
                            link.classList.add("active");
                        }
                    });
                }
            });
        }, observerOptions);

        sections.forEach(section => {
            observer.observe(section);
        });
    </script>

    </body>

    </html>
